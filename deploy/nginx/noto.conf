# Noto 云服务器入口 Nginx 配置示例
# 安装：sudo cp deploy/nginx/noto.conf /etc/nginx/sites-available/noto
#       sudo ln -s /etc/nginx/sites-available/noto /etc/nginx/sites-enabled/
# 证书：sudo certbot --nginx -d noto.example.com
#
# 前提：docker compose 将 frontend 绑定到 127.0.0.1:8080（见 docker-compose.prod.override.yml.example）

upstream noto_frontend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name noto.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name noto.example.com;

    # certbot 会自动写入以下两行；首次部署前可注释 ssl 块，仅用 certbot --nginx
    ssl_certificate     /etc/letsencrypt/live/noto.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/noto.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;

    # 安全头（按需调整 CSP）
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://noto_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE 流式 AI 问答：关闭缓冲
    location /api/v1/ai/ {
        proxy_pass http://noto_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://noto_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
