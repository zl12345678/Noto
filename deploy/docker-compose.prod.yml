# 云服务器生产 Compose 片段（与主 compose 合并使用）
# 需要 Docker Compose 2.24+（支持 ports: !override）
#
# 用法：
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
#
# 效果：frontend/backend 默认仅监听本机；db/minio 不映射到宿主机

services:
  db:
    ports: !reset []

  minio:
    ports: !reset []

  backend:
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:-9086}:9086"

  frontend:
    ports: !override
      - "${FRONTEND_IPV4_HOST:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
      - "${FRONTEND_IPV6_HOST:-[::1]}:${FRONTEND_PORT:-8080}:80"
