spring:
  devtools:
    restart:
      enabled: true
      poll-interval: 1s
      quiet-period: 400ms
      trigger-file: .reloadtrigger
      additional-exclude: static/**,public/**
    livereload:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/noto_zhihui_dev
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

logging:
  level:
    org.springframework.boot.devtools: info

# 启用 AI：NOTO_AI_ENABLED=true 且配置 AI_DASHSCOPE_API_KEY（阿里云百炼/通义）
noto:
  ai:
    enabled: ${NOTO_AI_ENABLED:false}
    model: qwen-turbo
    api-key: ${AI_DASHSCOPE_API_KEY:}
  demo:
    enabled: ${NOTO_DEMO_ENABLED:true}
    username: ${NOTO_DEMO_USERNAME:demo}
    password: ${NOTO_DEMO_PASSWORD:123456}
    email: ${NOTO_DEMO_EMAIL:demo@noto.local}
    nickname: ${NOTO_DEMO_NICKNAME:演示账号}
    create-user: ${NOTO_DEMO_CREATE_USER:true}
    reset-password: ${NOTO_DEMO_RESET_PASSWORD:true}
  minio:
    enabled: true
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: noto

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
