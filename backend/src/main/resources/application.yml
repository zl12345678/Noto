server:
  port: 9086

spring:
  application:
    name: noto-zhihui-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/noto_zhihui_dev
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      db-type: postgresql
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

logging:
  level:
    com.noto.zhihui: info

management:
  endpoints:
    web:
      exposure:
        include: health,info

noto:
  ai:
    enabled: true
