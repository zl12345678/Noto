server:
  port: 9086

spring:
  application:
    name: noto-zhihui-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${noto.ai.model:qwen-plus}
          temperature: 0.3

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      db-type: postgresql
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

logging:
  level:
    com.noto.zhihui: info

management:
  endpoints:
    web:
      exposure:
        include: health,info

noto:
  ai:
    enabled: false
    model: qwen-plus
    rag-pgvector-enabled: true
    rag-embedding-dimensions: 1024
    rag-max-chunks-scan: 3000
  demo:
    enabled: ${NOTO_DEMO_ENABLED:false}
    username: ${NOTO_DEMO_USERNAME:demo}
    password: ${NOTO_DEMO_PASSWORD:123456}
    email: ${NOTO_DEMO_EMAIL:demo@noto.local}
    nickname: ${NOTO_DEMO_NICKNAME:演示账号}
    create-user: ${NOTO_DEMO_CREATE_USER:false}
    reset-password: ${NOTO_DEMO_RESET_PASSWORD:false}
  minio:
    enabled: false
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: noto
    max-file-size-bytes: 104857600
