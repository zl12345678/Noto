server:
  port: 8080

spring:
  application:
    name: noto-zhihui-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/noto_zhihui
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.noto.zhihui: info

management:
  endpoints:
    web:
      exposure:
        include: health,info

noto:
  ai:
    enabled: true
