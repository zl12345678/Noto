spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/noto_zhihui}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

noto:
  security:
    jwt-secret: ${NOTO_JWT_SECRET:noto-zhihui-default-secret-key-32chars}
  ai:
    enabled: ${NOTO_AI_ENABLED:false}
    model: ${NOTO_AI_MODEL:qwen-plus}
    api-key: ${AI_DASHSCOPE_API_KEY:}
    rag-enabled: ${NOTO_AI_RAG_ENABLED:true}
  minio:
    enabled: ${NOTO_MINIO_ENABLED:false}
    endpoint: ${NOTO_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${NOTO_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${NOTO_MINIO_SECRET_KEY:minioadmin}
    bucket: ${NOTO_MINIO_BUCKET:noto}
  demo:
    enabled: ${NOTO_DEMO_ENABLED:false}
    username: ${NOTO_DEMO_USERNAME:admin}
    password: ${NOTO_DEMO_PASSWORD:admin123}
    email: ${NOTO_DEMO_EMAIL:admin@noto.com}
    nickname: ${NOTO_DEMO_NICKNAME:演示账号}
    create-user: ${NOTO_DEMO_CREATE_USER:false}

logging:
  level:
    com.noto.zhihui: info
    root: warn

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
